services:
  - type: web
    name: paychain-api
    runtime: node
    rootDir: hackathon_backend
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: paychain-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        value: "221770000001"
      - key: ADMIN_PASSWORD
        sync: false
      - key: BITNOB_CLIENT_ID
        sync: false
      - key: BITNOB_CLIENT_SECRET
        sync: false
      - key: BITNOB_WEBHOOK_SECRET
        sync: false

databases:
  - name: paychain-db
    databaseName: hackathon
    plan: free
    postgresMajorVersion: "16"
